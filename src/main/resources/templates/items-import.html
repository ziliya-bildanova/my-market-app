<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row p-2">
            <div class="col">
                <div class="hstack gap-3">
                    <h2>
                        <span class="badge text-bg-success">Витрина магазина</span>
                    </h2>
                    <a href="/orders" class="btn btn-secondary ms-auto bi bi-file-earmark-text"> Заказы</a>
                    <a href="/cart/items" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                    <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
                </div>
            </div>
        </div>
        <div class="row p-2">
            <div class="col">
                <div class="alert alert-success" role="alert" th:if="${imported != null}" th:text="${'Загружено товаров: '+imported}"></div>
                <div class="alert alert-danger" role="alert" th:if="${error != null}" th:text="${error}"></div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Загрузка товаров из CSV</h5>
                        <p class="card-text">
                            Файл в кодировке UTF-8 с разделителем «;» и строкой заголовка:
                            <code>title;description;imgPath;price</code>.
                            Если <code>imgPath</code> пуст, будет показана картинка по умолчанию.
                        </p>
                        <form method="post" th:action="@{/items/import}" enctype="multipart/form-data">
                            <div class="hstack gap-3">
                                <input class="form-control" type="file" name="file" accept=".csv" required>
                                <button type="submit" class="btn btn-warning">Загрузить</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
